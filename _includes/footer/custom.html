<!-- Support for MathJax -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    }
  };
</script>

<script defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  id="MathJax-script">
</script>

<!-- Support for Plotly -->
<script defer src='https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js'></script>

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

{% if page.toc %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/tocbot/4.32.2/tocbot.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (
    typeof tocbot === "undefined" ||
    !document.querySelector(".js-toc") ||
    !document.querySelector(".js-toc-content")
  ) {
    return;
  }

  tocbot.init({
    tocSelector: ".js-toc",
    contentSelector: ".js-toc-content",
    headingSelector: "h2, h3",
    collapseDepth: 6,
    scrollSmooth: true,
    headingsOffset: 80,
    scrollSmoothOffset: -80,
    hasInnerContainers: true,
    includeHtml: false
  });

  /* Render LaTeX inside Tocbot */
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
    MathJax.startup.promise.then(function () {
      return MathJax.typesetPromise([
        document.querySelector(".js-toc")
      ]);
    });
  }
});
</script>

{% endif %}
